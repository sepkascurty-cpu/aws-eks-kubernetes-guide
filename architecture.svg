<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="940" viewBox="0 0 1200 940" font-family="Arial, Helvetica, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#444444"/>
    </marker>
    <marker id="arrowBlue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#527FFF"/>
    </marker>
  </defs>

  <!-- White background -->
  <rect x="0" y="0" width="1200" height="940" fill="#ffffff"/>

  <!-- AWS Cloud boundary -->
  <rect x="12" y="12" width="1176" height="916" fill="none" stroke="#232F3E" stroke-width="2"/>
  <rect x="22" y="22" width="46" height="46" fill="#232F3E"/>
  <text x="45" y="52" font-size="20" font-weight="bold" fill="#ffffff" text-anchor="middle">aws</text>
  <text x="78" y="50" font-size="20" fill="#232F3E">AWS Cloud</text>

  <!-- Users -->
  <g>
    <rect x="180" y="92" width="70" height="46" rx="4" fill="none" stroke="#232F3E" stroke-width="2"/>
    <rect x="190" y="102" width="50" height="26" fill="none" stroke="#232F3E" stroke-width="1.5"/>
    <line x1="200" y1="138" x2="230" y2="138" stroke="#232F3E" stroke-width="2"/>
    <text x="215" y="88" font-size="13" fill="#232F3E" text-anchor="middle">Users</text>
    <text x="215" y="160" font-size="12" fill="#232F3E" text-anchor="middle">www.example.com</text>
  </g>

  <!-- Route 53 -->
  <g>
    <rect x="560" y="86" width="56" height="56" fill="#8C4FFF"/>
    <text x="588" y="112" font-size="17" font-weight="bold" fill="#ffffff" text-anchor="middle">53</text>
    <text x="588" y="130" font-size="11" fill="#ffffff" text-anchor="middle">Route 53</text>
    <text x="588" y="160" font-size="13" fill="#232F3E" text-anchor="middle">Amazon Route 53</text>
    <text x="588" y="177" font-size="12" font-style="italic" fill="#555555" text-anchor="middle">DNS service</text>
  </g>

  <!-- CloudFront -->
  <g>
    <rect x="400" y="196" width="56" height="56" fill="#8C4FFF"/>
    <circle cx="428" cy="224" r="16" fill="none" stroke="#ffffff" stroke-width="2.5"/>
    <circle cx="428" cy="224" r="6" fill="#ffffff"/>
    <text x="428" y="270" font-size="13" fill="#232F3E" text-anchor="middle">Amazon CloudFront</text>
    <text x="428" y="287" font-size="12" font-style="italic" fill="#555555" text-anchor="middle">CDN</text>
  </g>

  <!-- WAF (left, media path) -->
  <g>
    <rect x="240" y="196" width="56" height="56" fill="#D13239"/>
    <text x="268" y="230" font-size="15" font-weight="bold" fill="#ffffff" text-anchor="middle">WAF</text>
    <text x="268" y="270" font-size="13" fill="#232F3E" text-anchor="middle">AWS WAF</text>
    <text x="268" y="287" font-size="12" font-style="italic" fill="#555555" text-anchor="middle">Web Application Firewall</text>
  </g>

  <!-- WAF (right, www path) -->
  <g>
    <rect x="760" y="196" width="56" height="56" fill="#D13239"/>
    <text x="788" y="230" font-size="15" font-weight="bold" fill="#ffffff" text-anchor="middle">WAF</text>
    <text x="788" y="270" font-size="13" fill="#232F3E" text-anchor="middle">AWS WAF</text>
    <text x="788" y="287" font-size="12" font-style="italic" fill="#555555" text-anchor="middle">Web Application Firewall</text>
  </g>

  <!-- AWS Shield -->
  <g>
    <rect x="1064" y="86" width="56" height="56" fill="#D13239"/>
    <path d="M1092 96 l14 5 v12 c0 10 -6 17 -14 21 c-8 -4 -14 -11 -14 -21 v-12 z" fill="none" stroke="#ffffff" stroke-width="2"/>
    <text x="1092" y="160" font-size="13" fill="#232F3E" text-anchor="middle">AWS Shield</text>
    <text x="1092" y="177" font-size="12" font-style="italic" fill="#555555" text-anchor="middle">DDoS protection</text>
  </g>

  <!-- Traffic arrows (top) -->
  <line x1="250" y1="115" x2="556" y2="108" stroke="#444444" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="400" y="100" font-size="11" fill="#555555" text-anchor="middle">DNS query</text>
  <line x1="588" y1="142" x2="560" y2="196" stroke="#444444" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="588" y1="142" x2="700" y2="196" stroke="#444444" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="296" y1="224" x2="396" y2="224" stroke="#444444" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="346" y="212" font-size="11" fill="#555555" text-anchor="middle">media.example.com</text>

  <!-- EKS Control Plane (spans AZs, above VPC box top edge visually inside cloud) -->
  <g>
    <rect x="330" y="312" width="540" height="52" fill="#FEF3E2" stroke="#FF9900" stroke-width="2"/>
    <rect x="342" y="322" width="34" height="34" fill="#FF9900"/>
    <text x="359" y="344" font-size="13" font-weight="bold" fill="#ffffff" text-anchor="middle">EKS</text>
    <text x="388" y="336" font-size="14" font-weight="bold" fill="#232F3E">Amazon EKS Control Plane — managed by AWS</text>
    <text x="388" y="354" font-size="12" fill="#555555">API server • etcd • scheduler • controller manager — replicated across 3 AZs</text>
  </g>

  <!-- VPC boundary -->
  <rect x="30" y="380" width="1140" height="520" fill="none" stroke="#3F9C35" stroke-width="2"/>
  <rect x="42" y="392" width="34" height="34" fill="#3F9C35"/>
  <text x="59" y="415" font-size="14" font-weight="bold" fill="#ffffff" text-anchor="middle">VPC</text>
  <text x="84" y="417" font-size="15" fill="#3F9C35">VPC</text>
  <text x="84" y="436" font-size="11" fill="#555555">10.0.0.0/16 — EKS cluster VPC</text>

  <!-- Availability Zone 1 -->
  <rect x="270" y="446" width="420" height="440" fill="none" stroke="#527FFF" stroke-width="1.5" stroke-dasharray="7,5"/>
  <text x="480" y="468" font-size="15" fill="#527FFF" text-anchor="middle">Availability Zone 1</text>

  <!-- Availability Zone 2 -->
  <rect x="730" y="446" width="420" height="440" fill="none" stroke="#527FFF" stroke-width="1.5" stroke-dasharray="7,5"/>
  <text x="940" y="468" font-size="15" fill="#527FFF" text-anchor="middle">Availability Zone 2</text>

  <!-- Public subnet AZ-1 -->
  <rect x="284" y="480" width="392" height="76" fill="#EAF5E8" stroke="#3F9C35" stroke-width="1"/>
  <text x="296" y="502" font-size="13" font-weight="bold" fill="#3F9C35">Public subnet</text>
  <text x="296" y="520" font-size="11" fill="#555555">10.0.1.0/24</text>
  <g>
    <circle cx="620" cy="518" r="20" fill="none" stroke="#8C4FFF" stroke-width="2.5"/>
    <circle cx="620" cy="518" r="8" fill="#8C4FFF"/>
    <text x="620" y="548" font-size="12" fill="#232F3E" text-anchor="middle">NAT Gateway</text>
  </g>

  <!-- Public subnet AZ-2 -->
  <rect x="744" y="480" width="392" height="76" fill="#EAF5E8" stroke="#3F9C35" stroke-width="1"/>
  <text x="756" y="502" font-size="13" font-weight="bold" fill="#3F9C35">Public subnet</text>
  <text x="756" y="520" font-size="11" fill="#555555">10.0.2.0/24</text>
  <g>
    <circle cx="1080" cy="518" r="20" fill="none" stroke="#8C4FFF" stroke-width="2.5"/>
    <circle cx="1080" cy="518" r="8" fill="#8C4FFF"/>
    <text x="1080" y="548" font-size="12" fill="#232F3E" text-anchor="middle">NAT Gateway</text>
  </g>

  <!-- Private subnet — worker nodes AZ-1 -->
  <rect x="284" y="568" width="392" height="150" fill="#EAF1FB" stroke="#527FFF" stroke-width="1"/>
  <text x="296" y="590" font-size="13" font-weight="bold" fill="#527FFF">Private subnet — EKS worker nodes</text>
  <text x="296" y="608" font-size="11" fill="#555555">10.0.11.0/24 — Managed node group</text>
  <g>
    <rect x="310" y="622" width="70" height="52" fill="#FF9900"/>
    <text x="345" y="643" font-size="12" font-weight="bold" fill="#ffffff" text-anchor="middle">EC2</text>
    <text x="345" y="659" font-size="10" fill="#ffffff" text-anchor="middle">node 1</text>
    <rect x="392" y="622" width="70" height="52" fill="#FF9900"/>
    <text x="427" y="643" font-size="12" font-weight="bold" fill="#ffffff" text-anchor="middle">EC2</text>
    <text x="427" y="659" font-size="10" fill="#ffffff" text-anchor="middle">node 2</text>
    <rect x="474" y="622" width="70" height="52" fill="#FF9900"/>
    <text x="509" y="643" font-size="12" font-weight="bold" fill="#ffffff" text-anchor="middle">EC2</text>
    <text x="509" y="659" font-size="10" fill="#ffffff" text-anchor="middle">node 3</text>
    <text x="580" y="640" font-size="12" fill="#232F3E">Pods: app • api • worker</text>
    <text x="580" y="658" font-size="11" fill="#555555">Karpenter scales nodes</text>
  </g>

  <!-- Private subnet — worker nodes AZ-2 -->
  <rect x="744" y="568" width="392" height="150" fill="#EAF1FB" stroke="#527FFF" stroke-width="1"/>
  <text x="756" y="590" font-size="13" font-weight="bold" fill="#527FFF">Private subnet — EKS worker nodes</text>
  <text x="756" y="608" font-size="11" fill="#555555">10.0.12.0/24 — Managed node group</text>
  <g>
    <rect x="770" y="622" width="70" height="52" fill="#FF9900"/>
    <text x="805" y="643" font-size="12" font-weight="bold" fill="#ffffff" text-anchor="middle">EC2</text>
    <text x="805" y="659" font-size="10" fill="#ffffff" text-anchor="middle">node 1</text>
    <rect x="852" y="622" width="70" height="52" fill="#FF9900"/>
    <text x="887" y="643" font-size="12" font-weight="bold" fill="#ffffff" text-anchor="middle">EC2</text>
    <text x="887" y="659" font-size="10" fill="#ffffff" text-anchor="middle">node 2</text>
    <rect x="934" y="622" width="70" height="52" fill="#FF9900"/>
    <text x="969" y="643" font-size="12" font-weight="bold" fill="#ffffff" text-anchor="middle">EC2</text>
    <text x="969" y="659" font-size="10" fill="#ffffff" text-anchor="middle">node 3</text>
    <text x="1040" y="640" font-size="12" fill="#232F3E">Pods: app • api • worker</text>
    <text x="1040" y="658" font-size="11" fill="#555555">Spot + On-Demand mix</text>
  </g>

  <!-- Application Load Balancer (center, between AZs) -->
  <g>
    <rect x="682" y="742" width="56" height="56" fill="#8C4FFF"/>
    <circle cx="710" cy="770" r="13" fill="none" stroke="#ffffff" stroke-width="2.5"/>
    <path d="M700 770 h20 M710 760 v20" stroke="#ffffff" stroke-width="2.5"/>
    <text x="710" y="816" font-size="13" fill="#232F3E" text-anchor="middle">Application Load Balancer</text>
    <text x="710" y="833" font-size="12" font-style="italic" fill="#555555" text-anchor="middle">Ingress — public subnets only</text>
  </g>

  <!-- DB subnet AZ-1 -->
  <rect x="284" y="730" width="392" height="142" fill="#EAF1FB" stroke="#527FFF" stroke-width="1"/>
  <text x="296" y="752" font-size="13" font-weight="bold" fill="#527FFF">DB subnet</text>
  <text x="296" y="770" font-size="11" fill="#555555">10.0.21.0/24</text>
  <g>
    <rect x="330" y="786" width="56" height="56" fill="#527FFF"/>
    <ellipse cx="358" cy="800" rx="14" ry="6" fill="none" stroke="#ffffff" stroke-width="2"/>
    <path d="M344 800 v28 a14 6 0 0 0 28 0 v-28" fill="none" stroke="#ffffff" stroke-width="2"/>
    <text x="358" y="860" font-size="13" fill="#232F3E" text-anchor="middle">Amazon RDS</text>
    <text x="358" y="877" font-size="12" font-style="italic" fill="#555555" text-anchor="middle">Database (primary)</text>
  </g>
  <g>
    <rect x="500" y="786" width="56" height="56" fill="#D13239"/>
    <text x="528" y="820" font-size="13" font-weight="bold" fill="#ffffff" text-anchor="middle">Cache</text>
    <text x="528" y="860" font-size="13" fill="#232F3E" text-anchor="middle">ElastiCache</text>
    <text x="528" y="877" font-size="12" font-style="italic" fill="#555555" text-anchor="middle">Redis caching</text>
  </g>

  <!-- DB subnet AZ-2 -->
  <rect x="744" y="730" width="392" height="142" fill="#EAF1FB" stroke="#527FFF" stroke-width="1"/>
  <text x="756" y="752" font-size="13" font-weight="bold" fill="#527FFF">DB subnet</text>
  <text x="756" y="770" font-size="11" fill="#555555">10.0.22.0/24</text>
  <g>
    <rect x="790" y="786" width="56" height="56" fill="#527FFF"/>
    <ellipse cx="818" cy="800" rx="14" ry="6" fill="none" stroke="#ffffff" stroke-width="2"/>
    <path d="M804 800 v28 a14 6 0 0 0 28 0 v-28" fill="none" stroke="#ffffff" stroke-width="2"/>
    <text x="818" y="860" font-size="13" fill="#232F3E" text-anchor="middle">Amazon RDS</text>
    <text x="818" y="877" font-size="12" font-style="italic" fill="#555555" text-anchor="middle">Database (standby)</text>
  </g>
  <text x="960" y="820" font-size="12" fill="#555555" text-anchor="middle">DB subnet group —</text>
  <text x="960" y="837" font-size="12" fill="#555555" text-anchor="middle">Multi-AZ failover</text>

  <!-- ECR (left, outside VPC) -->
  <g>
    <rect x="60" y="560" width="56" height="56" fill="#FF9900"/>
    <rect x="76" y="576" width="24" height="24" fill="none" stroke="#ffffff" stroke-width="2.5"/>
    <text x="88" y="634" font-size="13" fill="#232F3E" text-anchor="middle">Amazon ECR</text>
    <text x="88" y="651" font-size="12" font-style="italic" fill="#555555" text-anchor="middle">Container images</text>
  </g>

  <!-- S3 (left, below ECR) -->
  <g>
    <rect x="60" y="700" width="56" height="56" fill="#3F9C35"/>
    <path d="M74 716 h28 l-4 24 h-20 z" fill="none" stroke="#ffffff" stroke-width="2.5"/>
    <text x="88" y="774" font-size="13" fill="#232F3E" text-anchor="middle">Amazon S3</text>
    <text x="88" y="791" font-size="12" font-style="italic" fill="#555555" text-anchor="middle">Backups &amp; static assets</text>
  </g>

  <!-- CloudWatch (right, below VPC) -->
  <g>
    <rect x="60" y="830" width="56" height="56" fill="#D13239"/>
    <path d="M70 866 l10 -16 l8 8 l10 -18" fill="none" stroke="#ffffff" stroke-width="2.5"/>
    <text x="124" y="856" font-size="13" fill="#232F3E">Amazon CloudWatch</text>
    <text x="124" y="873" font-size="12" font-style="italic" fill="#555555">Container Insights • logs • alarms</text>
  </g>

  <!-- Traffic arrows: WAF -> ALB, ALB -> nodes, nodes -> data, nodes -> ECR -->
  <line x1="788" y1="252" x2="740" y2="742" stroke="#444444" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="800" y="500" font-size="11" fill="#555555">HTTPS</text>
  <line x1="682" y1="770" x2="676" y2="660" stroke="#444444" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="640" y="700" font-size="11" fill="#555555">traffic</text>
  <line x1="738" y1="770" x2="744" y2="660" stroke="#444444" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="480" y1="718" x2="420" y2="786" stroke="#527FFF" stroke-width="1.5" marker-end="url(#arrowBlue)"/>
  <text x="400" y="760" font-size="11" fill="#527FFF">queries</text>
  <line x1="940" y1="718" x2="880" y2="786" stroke="#527FFF" stroke-width="1.5" marker-end="url(#arrowBlue)"/>
  <line x1="284" y1="640" x2="120" y2="600" stroke="#FF9900" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="180" y="600" font-size="11" fill="#FF9900">image pull</text>
  <!-- Control plane -> nodes (management) -->
  <line x1="600" y1="364" x2="520" y2="560" stroke="#FF9900" stroke-width="1.5" stroke-dasharray="5,4" marker-end="url(#arrow)"/>
  <line x1="600" y1="364" x2="900" y2="560" stroke="#FF9900" stroke-width="1.5" stroke-dasharray="5,4" marker-end="url(#arrow)"/>
  <text x="600" y="440" font-size="11" fill="#FF9900" text-anchor="middle">kubelet • scheduling (private API)</text>

  <!-- Legend -->
  <text x="30" y="922" font-size="12" fill="#555555">Traffic: User → Route 53 → CloudFront / WAF → ALB → EKS worker nodes → RDS / ElastiCache • Images: ECR → nodes • Control plane managed by AWS across 3 AZs</text>
</svg>
